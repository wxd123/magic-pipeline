[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-pipeline"
version = "0.1.1"
description = "占位包：Magic-pipeline 流程编排工具（即将推出）"
readme = "README.md"
license = "MIT" 
license-files = ["LICENSE"]
authors = [
    { name = "wxd123", email = "wxd123@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"

dependencies = [
    "click>=8.1.8",
    "pyyaml>=6.0.3",
]  # 如果有依赖，在这里添加

[project.scripts]
# 或使用别名
pipeline = "magic_pipeline.cli.cli:main"

[project.urls]
Homepage = "https://github.com/wxd123/magic-pipeline"





[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "magic-base",
    "magic-pipeline",
    "magic-tool",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "python-docstring-markdown>=0.2.2",
    "twine>=6.1.0",
]

[tool.uv.sources]
magic-base = { path = "../magic-base", editable = true }
magic-tool = { path = "../magic-tool", editable = true }
magic-pipeline = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    ".",
]
